services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: report_user
      POSTGRES_PASSWORD: report_pass
      POSTGRES_DB: report_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U report_user -d report_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Admin dashboard: browse report history, trigger ad-hoc runs, preview PDFs.
  admin:
    build: .
    command: node src/admin/server.js
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Inside the compose network the DB is reachable at "db", not "localhost".
      DATABASE_URL: postgres://report_user:report_pass@db:5432/report_db
    ports:
      - "4000:4000"
    volumes:
      - ./output:/app/output
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Cron-driven weekly job. Opt-in via: docker compose --profile scheduler up -d
  scheduler:
    build: .
    command: node src/jobs/scheduler.js
    restart: unless-stopped
    profiles: ["scheduler"]
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://report_user:report_pass@db:5432/report_db
    volumes:
      - ./output:/app/output
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');const s=fs.statSync('/app/output/.scheduler-heartbeat');process.exit((Date.now()-s.mtimeMs)<90000?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
