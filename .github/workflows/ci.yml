name: CI

# Runs the full test suite on every push and pull request. Two layers:
#   * unit tests           — pure logic, no I/O (npm test)
#   * integration tests    — the real pipeline against a live Postgres and a real
#                            headless Chrome (npm run test:db, RUN_DB_TESTS=1)
# No external paid services are used: the integration test blanks the LLM key
# (deterministic fallback summary) and never calls SendGrid.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    # Pinned (not ubuntu-latest) so the apt package names below stay stable.
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: report_user
          POSTGRES_PASSWORD: report_pass
          POSTGRES_DB: report_db
        ports:
          - 5432:5432
        # Wait until Postgres is actually accepting connections before the steps run.
        options: >-
          --health-cmd "pg_isready -U report_user -d report_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://report_user:report_pass@localhost:5432/report_db

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # npm ci also downloads Puppeteer's bundled Chrome (PUPPETEER_SKIP_DOWNLOAD
      # is only set in the Docker image, not here), so the PDF render test has a
      # browser to launch.
      - name: Install dependencies
        run: npm ci

      # Shared libraries headless Chrome needs that aren't guaranteed on the
      # runner. Names are for Ubuntu 24.04 (e.g. libasound2t64, not libasound2).
      - name: Install headless-Chrome system libraries + psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            postgresql-client \
            fonts-liberation libasound2t64 libatk-bridge2.0-0 libatk1.0-0 \
            libcairo2 libcups2 libdbus-1-3 libdrm2 libexpat1 libgbm1 \
            libglib2.0-0 libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 \
            libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 \
            libxrandr2 xdg-utils

      - name: Seed the demo database
        run: psql "$DATABASE_URL" -f db/init.sql

      - name: Unit tests (no database)
        run: npm test

      - name: Integration tests (real Postgres + headless Chrome)
        run: npm run test:db
        env:
          RUN_DB_TESTS: '1'
